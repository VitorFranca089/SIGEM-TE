<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos - SIGEM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="sidebar">
    <h1>SIGEM</h1><p class="sidebar-heading">Descubra</p>
    <nav class="sidebar-nav"><a href="index.html"><span>⌂</span>Início</a><a href="pesquisa.html"><span>⌕</span>Pesquisa</a><a href="contatos.html"><span>◉</span>Contatos docentes</a></nav>
    <p class="sidebar-heading">Área acadêmica</p>
    <nav class="sidebar-nav"><a href="classes.html"><span>☷</span>Classes</a><a href="grupos.html"><span>♫</span>Grupos</a></nav>
    <div class="sidebar-tools"><a href="conta.html"><span>⚙</span>Sua conta</a><button type="button" data-theme-toggle="dark" aria-pressed="false"><span>◐</span>Modo noturno <i></i></button><button type="button" data-theme-toggle="contrast" aria-pressed="false"><span>☼</span>Alto contraste</button></div>
  </header>

  <main>
    <div class="page-tools"><div class="view-switch"><button class="selecionado">Alunos</button><button>Relatórios</button></div><a class="page-cta" href="#formulario-aluno">Novo aluno <span>＋</span></a></div>
    <h2>Alunos</h2>

    <section class="cartao">
      <h3 id="titulo-formulario">Cadastrar aluno</h3>
      <form id="formulario-aluno">
        <!-- Guarda o id quando o formulario esta editando. Vazio = cadastro novo. -->
        <input type="hidden" id="aluno-id">

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="150" minlength="2" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" maxlength="150" required>
        </div>

        <!-- A senha so aparece no cadastro. Trocar senha e assunto do RF06. -->
        <div class="campo" id="campo-senha">
          <label for="senha">Senha inicial</label>
          <div class="campo-com-botao">
            <input type="password" id="senha" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="Use pelo menos 8 caracteres, uma letra maiúscula, uma minúscula, um número e um caractere especial." required>
            <button type="button" id="botao-ver-senha" class="secundario">Mostrar</button>
          </div>
          <small id="forca-senha" class="ajuda">Mínimo de 8 caracteres, com maiúscula, minúscula, número e caractere especial.</small>
        </div>

        <div class="campo" id="campo-confirmacao-senha">
          <label for="confirmacao-senha">Confirme a senha</label>
          <input type="password" id="confirmacao-senha" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="Repita uma senha com maiúscula, minúscula, número e caractere especial." required>
        </div>

        <div class="campo">
          <label for="data-nascimento">Data de nascimento</label>
          <!-- min e max sao preenchidos pelo JS: dependem da data de hoje -->
          <input type="date" id="data-nascimento">
        </div>

        <button type="submit" id="botao-salvar">Salvar</button>
        <button type="button" id="botao-cancelar" class="secundario" hidden>Cancelar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Nascimento</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
  </main>

  <script src="js/sessao.js"></script>
  <script src="js/alunos.js"></script>
  <script src="js/senha-ui.js"></script>
  <script src="js/rodape.js"></script>
</body>
</html>
