<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos - SIGEM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="sidebar">
    <h1>SIGEM</h1><p class="sidebar-heading">Descubra</p>
    <nav class="sidebar-nav"><a href="index.html"><span>⌂</span>Início</a><a href="pesquisa.html" class="ativo"><span>⌕</span>Pesquisa</a><a href="contatos.html"><span>◉</span>Contatos docentes</a></nav>
    <p class="sidebar-heading">Área acadêmica</p>
    <nav class="sidebar-nav"><a href="classes.html"><span>☷</span>Classes</a><a href="grupos.html"><span>♫</span>Grupos</a></nav>
    <div class="sidebar-tools"><a href="conta.html"><span>⚙</span>Sua conta</a><button type="button" data-theme-toggle="dark" aria-pressed="false"><span>◐</span>Modo noturno <i></i></button><button type="button" data-theme-toggle="contrast" aria-pressed="false"><span>☼</span>Alto contraste</button></div>
  </header>

  <main>
    <div class="page-tools"><div class="view-switch"><button class="selecionado">Cursos</button><button>Catálogo</button></div><a class="page-cta" href="#formulario-curso">Novo curso <span>＋</span></a></div>
    <h2>Cursos</h2>
    <p id="aviso-permissao" class="aviso" hidden></p>

    <section class="cartao" id="cartao-curso">
      <h3 id="titulo-formulario">Cadastrar curso</h3>
      <form id="formulario-curso">
        <input type="hidden" id="curso-id">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="150" minlength="2" required>
        </div>
        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" maxlength="2000" rows="4"></textarea>
        </div>
        <button type="submit">Salvar</button>
        <button type="button" id="botao-cancelar" class="secundario" hidden>Cancelar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <div class="tabela-wrapper">
      <table>
        <thead><tr><th>Curso</th><th>Descrição</th><th>Ações</th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
  </main>

  <script src="js/sessao.js"></script>
  <script src="js/cursos.js"></script>
  <script src="js/rodape.js"></script>
</body>
</html>
